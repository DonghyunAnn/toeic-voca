<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC VOCA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>ETS 토익 VOCA</title>
</head>
<body>

<div id="loading" class="loading"><span class="spinner"></span></div>

<div id="app" hidden>

  <main id="main">

    <!-- ─────────────── 홈 ─────────────── -->
    <section class="view" data-view="home">
      <header class="page-head">
        <h1>ETS 토익 VOCA</h1>
        <p class="sub" id="home-sub"></p>
      </header>

      <section class="card review-card">
        <div class="review-count">
          <span id="due-count">0</span>
          <span class="unit">단어</span>
        </div>
        <p class="muted" id="due-label">오늘 복습할 단어</p>
        <button class="btn btn-primary btn-block" id="start-review">복습 시작</button>
      </section>

      <div class="stat-row">
        <div class="stat"><b id="stat-seen">0</b><span>학습한 단어</span></div>
        <div class="stat"><b id="stat-mastered">0</b><span>암기 완료</span></div>
        <div class="stat"><b id="stat-total">0</b><span>전체 단어</span></div>
      </div>

      <section class="section">
        <h2 class="section-title">박스 분포</h2>
        <div class="boxbar" id="boxbar"></div>
        <p class="hint">틀리면 1번, 맞히면 다음 박스로. 박스가 높을수록 복습 간격이 길어집니다.</p>
      </section>

      <section class="section">
        <h2 class="section-title">DAY 목록</h2>
        <div class="day-grid" id="day-grid"></div>
      </section>
    </section>

    <!-- ─────────────── 학습 ─────────────── -->
    <section class="view" data-view="study">
      <header class="study-head">
        <button class="icon-btn" id="study-exit" aria-label="학습 종료">
          <svg viewBox="0 0 24 24" class="ico"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="progress"><div class="progress-fill" id="study-progress"></div></div>
        <span class="counter" id="study-counter">0/0</span>
      </header>

      <div class="card-stage" id="card-stage">
        <article class="flashcard" id="flashcard">
          <div class="face front">
            <span class="chip" id="card-day"></span>
            <p class="prompt" id="card-front"></p>
            <p class="hint tap-hint">탭하면 뜻이 보입니다</p>
          </div>
          <div class="face back" id="card-back"></div>
        </article>
      </div>

      <div class="grade-bar" id="grade-bar" hidden>
        <button class="btn btn-grade again" data-grade="again">모름</button>
        <button class="btn btn-grade hard"  data-grade="hard">애매</button>
        <button class="btn btn-grade good"  data-grade="good">안다</button>
      </div>

      <div class="empty" id="study-done" hidden>
        <p class="empty-title">복습 완료</p>
        <p class="muted" id="study-done-sub"></p>
        <button class="btn btn-outline" data-nav="home">홈으로</button>
      </div>
    </section>

    <!-- ─────────────── 목록 ─────────────── -->
    <section class="view" data-view="list">
      <header class="page-head">
        <h1>단어 목록</h1>
      </header>

      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="단어 또는 뜻 검색" autocomplete="off">
        </div>
        <button class="btn btn-outline btn-sm" id="toggle-mask" aria-pressed="false">뜻 가리기</button>
      </div>

      <div class="chips" id="day-chips"></div>
      <p class="muted list-count" id="list-count"></p>
      <div id="word-list" class="word-list"></div>
    </section>

    <!-- ─────────────── 퀴즈 ─────────────── -->
    <section class="view" data-view="quiz">
      <header class="page-head">
        <h1>퀴즈</h1>
      </header>

      <div id="quiz-setup">
        <section class="section">
          <h2 class="section-title">범위</h2>
          <div class="segmented" id="quiz-scope">
            <button data-scope="due" class="on">오늘 복습분</button>
            <button data-scope="day">DAY 선택</button>
            <button data-scope="all">전체</button>
          </div>
          <select id="quiz-day" class="select" hidden></select>
        </section>

        <section class="section">
          <h2 class="section-title">문항 수</h2>
          <div class="segmented" id="quiz-length">
            <button data-len="10" class="on">10</button>
            <button data-len="20">20</button>
            <button data-len="0">전체</button>
          </div>
        </section>

        <p class="muted" id="quiz-avail"></p>
        <button class="btn btn-primary btn-block" id="quiz-start">시작</button>
      </div>

      <div id="quiz-run" hidden>
        <header class="study-head">
          <button class="icon-btn" id="quiz-exit" aria-label="퀴즈 종료">
            <svg viewBox="0 0 24 24" class="ico"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <div class="progress"><div class="progress-fill" id="quiz-progress"></div></div>
          <span class="counter" id="quiz-counter">0/0</span>
        </header>
        <p class="quiz-question" id="quiz-question"></p>
        <div class="options" id="quiz-options"></div>
        <button class="btn btn-primary btn-block" id="quiz-next" hidden>다음</button>
      </div>

      <div id="quiz-result" hidden>
        <section class="card score-card">
          <div class="review-count"><span id="quiz-score">0</span><span class="unit">점</span></div>
          <p class="muted" id="quiz-score-sub"></p>
        </section>
        <section class="section" id="quiz-wrong-wrap" hidden>
          <h2 class="section-title">틀린 단어</h2>
          <div id="quiz-wrong" class="word-list"></div>
        </section>
        <div class="btn-row">
          <button class="btn btn-outline btn-block" id="quiz-again">다시</button>
          <button class="btn btn-primary btn-block" data-nav="home">홈으로</button>
        </div>
      </div>
    </section>

    <!-- ─────────────── 설정 ─────────────── -->
    <section class="view" data-view="settings">
      <header class="page-head">
        <h1>설정</h1>
      </header>

      <section class="section">
        <h2 class="section-title">출제 방향</h2>
        <div class="segmented" id="set-direction">
          <button data-dir="en2ko">영 → 한</button>
          <button data-dir="ko2en">한 → 영</button>
          <button data-dir="mixed">혼합</button>
        </div>
        <p class="hint">플래시카드와 퀴즈에 함께 적용됩니다.</p>
      </section>

      <section class="section">
        <h2 class="section-title">하루 분량</h2>
        <div class="segmented" id="set-limit">
          <button data-limit="10">10</button>
          <button data-limit="20">20</button>
          <button data-limit="30">30</button>
          <button data-limit="50">50</button>
        </div>
        <p class="hint">복습할 단어가 많아도 이 개수까지만 출제합니다.</p>
      </section>

      <section class="section">
        <h2 class="section-title">데이터</h2>
        <div class="stack">
          <button class="btn btn-outline btn-block" id="export">진도 내보내기</button>
          <button class="btn btn-outline btn-block" id="import">진도 불러오기</button>
          <input type="file" id="import-file" accept="application/json" hidden>
          <button class="btn btn-destructive btn-block" id="reset">진도 초기화</button>
        </div>
        <p class="hint">진도는 이 브라우저에만 저장됩니다. 기기를 옮길 때는 내보내기를 쓰세요.</p>
      </section>

      <section class="section">
        <h2 class="section-title">정보</h2>
        <dl class="info" id="info"></dl>
      </section>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button data-nav="home">
      <svg viewBox="0 0 24 24" class="ico"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>홈</span>
    </button>
    <button data-nav="study">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      <span>학습</span>
    </button>
    <button data-nav="list">
      <svg viewBox="0 0 24 24" class="ico"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>목록</span>
    </button>
    <button data-nav="quiz">
      <svg viewBox="0 0 24 24" class="ico"><path d="M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.7v.5"/><path d="M12 17.5h.01"/><circle cx="12" cy="12" r="9"/></svg>
      <span>퀴즈</span>
    </button>
    <button data-nav="settings">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
      <span>설정</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
